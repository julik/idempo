name: CI

on:
  - push
  - pull_request

env:
  BUNDLE_PATH: vendor/bundle

# The suite has three independent dimensions - Ruby version, Rack major version, and which
# datastore a backend talks to - and they do not interact. Only `idempo_spec.rb` touches the
# Rack API at all; every backend spec is Rack-agnostic, and the datastore adapters care about
# neither Ruby nor Rack. So these are covered separately rather than as a cross product, and
# exactly one job needs database containers.
jobs:
  lint:
    name: Code Style
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          # The style target comes from .standard.yml, so the Ruby here does not matter
          ruby-version: "3.4"
          bundler-cache: true
      - name: Standard (Lint)
        run: bundle exec rake standard

  standalone:
    name: "Ruby ${{ matrix.ruby }}, Rack ${{ matrix.rack }}.x"
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        # The oldest Ruby the gemspec allows and the newest released one. Bundler resolves
        # the newest Rails that runs on each, so this also covers ActiveRecord 7.1 and 8.1
        # through the SQLite backend without naming a single Rails version anywhere.
        ruby: ["2.7", "4.0"]
        rack: ["2", "3"]
    env:
      RACK_VERSION: "~> ${{ matrix.rack }}.0"
      # No database server is involved, so the native clients are not even installed
      BUNDLE_WITHOUT: db_servers
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          # Both Rack variants share a Gemfile, so keep their bundles in separate caches
          cache-version: rack-${{ matrix.rack }}
      - name: RSpec (middleware, memory and SQLite backends, install generator)
        run: bundle exec rake spec:standalone

  servers:
    name: "Database backend (${{ matrix.backend }})"
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    # The only jobs that need containers, and the only ones that run these specs. The
    # adapters are independent of the Ruby and Rack dimensions covered above, so newest
    # of everything is enough here. The backends do not depend on each other either, so
    # each runs in its own job - a service whose image is blank does not get started.
    strategy:
      fail-fast: false
      matrix:
        backend: [mysql, postgres, redis]
    services:
      mysql:
        image: ${{ matrix.backend == 'mysql' && 'mysql:5.7' || '' }}
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
      postgres:
        image: ${{ matrix.backend == 'postgres' && 'postgres' || '' }}
        env:
          POSTGRES_PASSWORD: postgres
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: ${{ matrix.backend == 'redis' && 'redis' || '' }}
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          - 6379:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: RSpec (${{ matrix.backend }})
        run: bundle exec rake spec:${{ matrix.backend }}
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
